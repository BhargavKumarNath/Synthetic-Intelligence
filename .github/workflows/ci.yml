name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Lint and Format
      run: |
        black --check .
        ruff check .

    - name: Type Checking (mypy)
      run: |
        mypy src/

    - name: Security Scan (bandit)
      run: |
        bandit -r src/

    - name: Dependency Vulnerability Scan (pip-audit)
      run: |
        pip-audit

    - name: Unit Tests
      run: |
        pytest tests/

    - name: Smoke Tests
      run: |
        python smoke_test_phase_1.py
        python smoke_test_phase_2.py
