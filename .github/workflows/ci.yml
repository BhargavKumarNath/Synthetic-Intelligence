name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_format:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff
    - name: Check formatting with black
      run: black --check .
    - name: Lint with ruff
      run: ruff check .

  type_check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run mypy
      run: mypy src/

  security_scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
    - name: Run Bandit
      run: bandit -r src/
    - name: Dependency Vulnerability Scan (pip-audit)
      run: |
        pip-audit --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-1375 --ignore-vuln PYSEC-2026-1374 --ignore-vuln PYSEC-2026-3625 --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-2875 --ignore-vuln PYSEC-2026-2876 --ignore-vuln PYSEC-2026-3721 --ignore-vuln PYSEC-2026-2275 --ignore-vuln PYSEC-2026-3447 --ignore-vuln PYSEC-2026-142 --ignore-vuln PYSEC-2026-141 --ignore-vuln PYSEC-2026-3552

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run pytest
      run: pytest tests/

  smoke_tests:
    name: Smoke Tests
    needs: [lint_and_format, type_check, security_scan, unit_tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run Phase 1 Smoke Test
      run: python smoke_test_phase_1.py
    - name: Run Phase 2 Smoke Test
      run: python smoke_test_phase_2.py
