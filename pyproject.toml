[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic_intelligence"
version = "0.1.0"
description = "A synthetic data generation and evaluation pipeline."
authors = [{name = "Antigravity", email = "antigravity@example.com"}]
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "imblearn",
    "torch",
    "h2o",
    "faiss-cpu",
    "dvc",
    "hydra-core",
    "pandera",
    "pydantic",
    "mlflow"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["synthetic_intelligence*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "RUF059",
]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception (too strict for H2O/third-party initialization)
    "RUF059", # Unpacked variable is never used (common when returning multiple values like distances, indices)
]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
